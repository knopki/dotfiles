[vars]
GPG_SIGN_KEY = { age = "" }
USER_NAME = { age = "" }
USER_EMAIL = { age = "" }
USER_PUBLIC_NAME = { age = "" }
USER_PUBLIC_EMAIL = { age = "" }
USER_AMP_EMAIL = { age = "" }
RCLONE_CONF = { age = { value = "", format = "zstd" } }
TW_SYNC_SERVER_URL = { age = "" }
TW_SYNC_SERVER_CLIENT_ID = { age = "" }
TW_SYNC_ENCRYPTION_SECRET = { age = "" }
ZED_SSH_CONNECTIONS = { age = "" }

[dotfiles]
#
# Agent skills
#
"~/.agents/skills" = { source = "agents/skills", mode = "copy" }


#
# bash
#
"~/.bash_profile" = { source = "bash/bash_profile", mode = "copy" }
"~/.bashrc" = { source = "bash/bashrc", mode = "copy" }


#
# curl
#
"~/.curlrc" = { source = "curl/curlrc", mode = "copy" }


#
# Face
#
"~/.face" = { source = "face.jpg", mode = "copy" }


#
# fish
#
"~/.config/fish" = { source = "fish", mode = "copy", exclude = ["fish_variables"] }

#
# git
#
"~/.config/git/ignore" = { source = "git/ignore", mode = "copy" }
"~/.config/git/config" = { source = "git/config.tmpl", mode = "template" }
"~/.config/git/public-identity" = { source = "git/public-identity.tmpl", mode = "template" }
"~/.config/git/amp-identity" = { source = "git/amp-identity.tmpl", mode = "template" }


#
# gnupg
#
"~/.gnupg/gpg.conf" = { source = "gnupg/gpg.conf", mode = "copy" }
"~/.gnupg/gpg-agent.conf" = { source = "gnupg/gpg-agent.conf", mode = "copy" }
"~/.pam-gnupg" = { source = "gnupg/pam-gnupg", mode = "copy" }


#
# Helix
#
"~/.config/helix/config.toml" = { source = "helix/config.toml", mode = "copy" }
"~/.config/helix/languages.toml" = { source = "helix/languages.toml", mode = "copy" }


#
# htop
#
"~/.config/htop/htoprc" = { source = "htop/htoprc", mode = "copy" }


#
# khal
#
"~/.config/khal/config" = { source = "pim/khal/config", mode = "copy" }


#
# khard
#
"~/.config/khard/khard.conf" = { source = "pim/khard/khard.conf", mode = "copy" }


#
# Lazygit
#
"~/.config/lazygit/config.yml" = { source = "lazygit/config.yml", mode = "copy" }


#
# MPV
#
"~/.config/mpv" = { source = "mpv", mode = "copy" }


#
# npm
#
"~/.npmrc" = { source = "npm/npmrc", mode = "copy" }


#
# rclone
#
"~/.config/rclone/rclone.conf" = { source = "rclone/rclone.conf.tmpl", mode = "template" }


#
# Restic
#
"~/.resticignore" = { source = "restic/resticignore", mode = "copy" }


#
# ssh
#
"~/.ssh/config" = { source = "ssh/config", mode = "copy" }


#
# Starship
#
"~/.config/starship.toml/schema" = { line = "\"$schema\" = 'https://starship.rs/config-schema.json'", position = "prepend" }
"~/.config/starship.toml/settings" = { source = "starship/settings.toml", template = "tera" }


#
# Taskwarrior
#
"~/.config/task/hooks" = { source = "pim/task/hooks", mode = "copy" }
"~/.config/task/nautical_core" = { source = "pim/task/nautical_core", mode = "copy" }
"~/.config/task/agenttaskrc" = { source = "pim/task/agenttaskrc", mode = "copy" }
"~/.config/task/sync" = { source = "pim/task/sync.tmpl", mode = "template" }
"~/.config/task/taskrc" = { source = "pim/task/taskrc", mode = "copy" }


#
# Terraform
#
"~/.terraformrc" = { source = "terraform/terraformrc", mode = "copy" }


#
# Timewarrior
#
"~/.config/timewarrior" = { source = "pim/timewarrior", mode = "copy" }


#
# tmpfiles
#
"~/.config/user-tmpfiles.d" = { source = "tmpfiles", mode = "copy" }


#
# uv
#
"~/.config/uv/uv.toml" = { source = "uv/uv.toml", mode = "copy" }


#
# vdirsyncer
#
"~/.config/vdirsyncer/config" = { source = "pim/vdirsyncer/config", mode = "copy" }


#
# wget
#
"~/.wgetrc" = { source = "wget/wgetrc", mode = "copy" }


#
# XDG
#
"~/.config/autostart/Nextcloud.desktop" = { source = "xdg/autostart/Nextcloud.desktop", mode = "copy" }
"~/.config/autostart/org.keepassxc.KeePassXC.desktop" = { source = "xdg/autostart/org.keepassxc.KeePassXC.desktop", mode = "copy" }
"~/.config/autostart/org.opengamingcollective.rog-control-center.desktop" = { source = "xdg/autostart/org.opengamingcollective.rog-control-center.desktop", mode = "copy" }
"~/.config/autostart/org.telegram.desktop.desktop" = { source = "xdg/autostart/org.telegram.desktop.desktop", mode = "copy" }
"~/.config/autostart/remmina-applet.desktop" = { source = "xdg/autostart/remmina-applet.desktop", mode = "copy" }
"~/.config/autostart/startup-sound.desktop" = { source = "xdg/autostart/startup-sound.desktop", mode = "copy" }
"~/.config/environment.d/00-xdg.conf" = { source = "xdg/environment.d/00-xdg.conf", mode = "copy" }
"~/.config/user-dirs.conf" = { source = "xdg/user-dirs.conf", mode = "copy" }
"~/.config/user-dirs.locale" = { source = "xdg/user-dirs.locale", mode = "copy" }
"~/.config/user-dirs.dirs" = { source = "xdg/user-dirs.dirs", mode = "copy" }
"~/.config/mimeapps.list" = { source = "xdg/mimeapps.list", mode = "copy" }
"~/.local/share/desktop-login.wav" = { source = "xdg/autostart/desktop-login.wav", mode = "copy" }


#
# Zed
#
"~/.config/zed/settings.json" = { source = "zed/settings.json.tera", mode = "template" }
"~/.config/zed/debug.json" = { source = "zed/debug.json", mode = "copy" }
"~/.config/zed/keymap.json" = { source = "zed/keymap.json", mode = "copy" }
"~/.config/zed/tasks.json" = { source = "zed/tasks.json", mode = "copy" }


#
# Hooks
#
# ssh/config uses ControlPath and Include from these directories; dotfiles
# cannot create empty directories, so the hook makes them on every apply.
# The avatar icon is a HOME-internal symlink to the copied ~/.face, which mise
# dotfiles cannot express; recreate it after the copy.
[bootstrap.hooks.post-dotfiles]
run = """
mkdir -p ~/.ssh/connections ~/.ssh/conf.d
ln -sf .face ~/.face.icon
"""

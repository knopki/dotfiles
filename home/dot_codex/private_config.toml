personality = "pragmatic"
model = "google/gemini-3-flash-preview"
model_reasoning_effort = "medium"
model_provider = "proxy"
model_catalog_json = "./custom_models.json"

approval_policy = "untrusted"
sandbox_mode    = "read-only"
allow_login_shell = false # optional hardening: disallow login shells for shell-based tools

[model_providers.proxy]
name = "Proxy"
base_url = "http://127.0.0.1:8317/v1"
#env_key = "OPENAI_API_KEY"

[features]
use_linux_sandbox_bwrap = true
multi_agent = true
prevent_idle_sleep = true
shell_snapshot = true
shell_tool = true
smart_approvals = true
unified_exec = true
undo = true

[sandbox_workspace_write]
network_access = true
web_search = "cached"  # default
exclude_tmpdir_env_var = false  # Allow $TMPDIR
exclude_slash_tmp = false       # Allow /tmp
writable_roots = ["/home/sk/.cache/uv"]
approval_policy = { granular = {
  sandbox_approval = false,
  rules = true,
  mcp_elicitations = true,
  request_permissions = false,
  skill_approval = false
} }

[profiles.full_auto]
approval_policy = "on-request"
sandbox_mode    = "workspace-write"

[profiles.readonly_quiet]
approval_policy = "never"
sandbox_mode    = "read-only"

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "context-used", "five-hour-limit", "weekly-limit"]

[projects."/home/sk/prj/media-viewer/media-viewer"]
trust_level = "trusted"

[projects."/home/sk/prj/ops/devops-at-home"]
trust_level = "trusted"

[projects."/home/sk/prj/wrk-tld4-esdd/esdd-online"]
trust_level = "trusted"

[projects."/home/sk/prj/media-viewer"]
trust_level = "trusted"

[projects."/home/sk/.hermes"]
trust_level = "trusted"

[projects."/home/sk/prj/agent-skills/agent-skills"]
trust_level = "trusted"

[projects."/home/sk/.codex"]
trust_level = "trusted"

